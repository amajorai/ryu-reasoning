[package]
name = "ryu-reasoning"
version = "0.1.13"
edition = "2021"
license = "Apache-2.0"
description = "Automated reasoning checks for Ryu: a from-scratch decision procedure (finite-domain enumeration over booleans/enums + Fourier–Motzkin over linear rational arithmetic, with branch-and-bound for integers) that decides whether an LLM answer is entailed by, contradicts, or is merely consistent with a formal policy. Ships the policy model, the DSL parser, the solver, the verdict layer with solver-derived corrections and minimal unsat cores, and the HTTP surface. ZERO dependency on apps/core — the sidecar reaches the host only over the generic `/api/host/model/complete` callback."
repository = "https://github.com/amajorai/ryu"

# The out-of-process sidecar binary. Core spawns it (`kind: local`, sibling on
# PATH / `RYU_REASONING_BIN`), health-checks it, and proxies `/api/reasoning/*` to
# it on loopback — exactly like `ryu-monitors` / `ryu-simulator`.
[[bin]]
name = "ryu-reasoning"
path = "src/main.rs"

[lib]
name = "ryu_reasoning"
path = "src/lib.rs"

# Versions are matched to apps/core/Cargo.toml so a future in-process merge has no
# version skew. This crate has ZERO dependency on apps/core.
[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
tower-http = { version = "0.5", features = ["cors"] }
